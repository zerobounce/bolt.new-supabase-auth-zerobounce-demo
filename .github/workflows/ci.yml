name: CI

on:
  # Started by dependabot-auto-merge.yml after it merges: a merge made with GITHUB_TOKEN
  # starts no push workflows.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  migration-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify migration SQL
        run: |
          test -f zb_migration.sql
          grep -q 'validate_email_with_zerobounce' zb_migration.sql
          grep -q "valid', false" zb_migration.sql
